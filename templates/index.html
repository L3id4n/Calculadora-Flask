<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Desafio</title>
    </head>

    <body>
        <h1>Desafio</h1>
        <h4>O desafio consiste em fazer uma calculadora que guarda os valores já utilizados</h4>

        <form method="POST">
            
            <select name="operacao">
                
                <option value="soma">Soma</option>
                <option value="subtracao">Subtração</option>
                <option value="multiplicacao">Multiplicação</option>
                <option value="divisao">Divisão</option>

            </select>

                <input type="number" name="number1" value="{{ number1 }}">
                <input type="number" name="number2" value="{{ number2 }}">

                <button>Enviar</button>
        </form>

        <h4>O resultado da {{ operacao }} é {{ result }}</h4>

        <h3>Valores usados: {{ number1 }}; {{ number2 }} </h3>

    </body>
</html>
